
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova Technology | Integrated IT Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Cairo', sans-serif;
        }
        body {
            font-family: var(--font-main);
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            background-color: #ffffff;
        }
        
        .h-xl { font-size: clamp(2.25rem, 5vw + 1rem, 4.5rem); line-height: 1.1; font-weight: 900; }
        .h-lg { font-size: clamp(1.75rem, 3.5vw + 0.5rem, 3rem); line-height: 1.2; font-weight: 800; }
        .p-lg { font-size: clamp(0.9375rem, 0.5vw + 0.75rem, 1.125rem); line-height: 1.8; font-weight: 600; }
        
        .text-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Luxury geometric pattern for footer */
        .footer-geometric {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(59, 130, 246, 0.15) 1px, transparent 0);
            background-size: 40px 40px;
            position: relative;
        }
        .footer-geometric::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(2, 6, 23, 0.8) 0%, rgba(2, 6, 23, 0.95) 100%);
            z-index: 1;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        [dir="rtl"] .vertical-text {
            writing-mode: vertical-rl;
        }
        [dir="ltr"] .vertical-text {
            writing-mode: vertical-lr;
        }
    </style>
